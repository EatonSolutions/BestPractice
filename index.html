erySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);$('#'+b.getAttribute('aria-controls')).hidden=!o});document.querySelectorAll('[data-task]').forEach(x=>x.onchange=update)}function restore(){let s={};try{s=JSON.parse(localStorage.getItem('ta-progress')||'{}')}catch(e){}document.querySelectorAll('[data-task]').forEach(x=>x.checked=!!s[x.dataset.task])}function update(){const u=DATA.ui[lang],saved={};let completed=0;document.querySelectorAll('.card').forEach(c=>{const xs=[...c.querySelectorAll('[data-task]')],d=xs.filter(x=>x.checked).length,ok=d===xs.length;xs.forEach(x=>saved[x.dataset.task]=x.checked);c.classList.toggle('done',ok);c.querySelector('.status').textContent=ok?u.complete:d?u.steps.replace('{d}',d).replace('{t}',xs.length):u.pending;if(ok)completed++});localStorage.setItem('ta-progress',JSON.stringify(saved));const p=Math.round(completed/8*100);$('#count').textContent=completed;$('#percent').textContent=p+'%';$('#fill').style.width=p+'%';$('#badge').hidden=completed!==8}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('ta-lang',lang);render()});$('#expand').onclick=()=>{allOpen=!allOpen;render()};$('#reset').onclick=()=>{localStorage.removeItem('ta-progress');render()};$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('ta-theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('ta-theme')==='dark')document.body.classList.add('dark');render();</script></body></html>
